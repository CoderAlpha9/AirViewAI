<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">AirView AI operational architecture</title>
  <desc id="desc">Live providers form a canonical snapshot. A persistence-trained residual is optionally transferred onto live CAMS before independent dashboard panels and the fixed next-24-hour comparison are rendered.</desc>
  <rect width="960" height="250" fill="#071718"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#eaf6f2" stroke="#59d7b3" stroke-width="1.5">
    <rect x="25" y="35" width="190" height="70" rx="10" fill="#0d2627"/><text x="120" y="64" text-anchor="middle" stroke="none">CPCB / OpenAQ stations</text><text x="120" y="85" text-anchor="middle" stroke="none">CAMS / weather / FIRMS / OSM</text>
    <rect x="280" y="35" width="175" height="70" rx="10" fill="#0d2627"/><text x="367" y="64" text-anchor="middle" stroke="none">Canonical snapshot</text><text x="367" y="85" text-anchor="middle" stroke="none">city · pollutant · horizon · issue</text>
    <rect x="520" y="35" width="190" height="70" rx="10" fill="#0d2627"/><text x="615" y="64" text-anchor="middle" stroke="none">Persistence-residual transfer</text><text x="615" y="85" text-anchor="middle" stroke="none">no CAMS values in training</text>
    <rect x="775" y="20" width="160" height="70" rx="10" fill="#0d2627"/><text x="855" y="49" text-anchor="middle" stroke="none">Independent live panels</text><text x="855" y="70" text-anchor="middle" stroke="none">stale responses rejected</text>
    <rect x="775" y="135" width="160" height="70" rx="10" fill="#0d2627"/><text x="855" y="163" text-anchor="middle" stroke="none">Fixed next-24h PM2.5</text><text x="855" y="184" text-anchor="middle" stroke="none">one context per city</text>
    <path d="M215 70H280M455 70H520M710 70H775M615 105V170H775" fill="none"/>
  </g>
</svg>
