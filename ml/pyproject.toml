[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airview-ml"
version = "0.1.0"
description = "Machine-learning contracts and pipelines for AirView AI"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4,<2.0",
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=23,<24",
  "pyproj>=3.7,<4.0",
  "python-dotenv>=1.0,<2.0",
  "scikit-learn>=1.9,<2.0",
  "shapely>=2.0,<3.0",
  "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1,<4.0"]
test = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["airview_ml*"]

[tool.setuptools.package-data]
"airview_ml.data.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
