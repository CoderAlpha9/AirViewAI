[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airview-ml"
version = "0.1.0"
description = "Machine-learning contracts and pipelines for AirView AI"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4,<2.0",
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.6,<2.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1,<4.0"]
test = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["airview_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

